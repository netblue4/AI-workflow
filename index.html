<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Acceptable Use — Governance Workflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

  <!-- LEFT: Navigation panel -->
  <nav class="nav-panel" aria-label="Workflow navigation">
    <div class="nav-header">
      <p class="nav-header-title">ISO/IEC 42001-aligned</p>
      <p class="nav-header-subtitle">AI Acceptable Use<br>Governance Workflow</p>
    </div>

    <!-- Central use-case identity — shared across all steps -->
    <div class="uc-panel" id="uc-panel">
      <p class="uc-panel-title">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
        Use Case Record
      </p>
      <input id="uc-name" class="uc-input" type="text" placeholder="Use case name" autocomplete="off">
      <input id="uc-id"   class="uc-input" type="text" placeholder="Use case ID  (e.g. UC-2025-001)" autocomplete="off">
      <input id="uc-by"   class="uc-input" type="text" placeholder="Assessed by  (name / role)" autocomplete="off">
      <div class="uc-btn-row">
        <button class="uc-btn uc-btn-load" onclick="handleUCLoad()">Load Record</button>
        <button class="uc-btn uc-btn-save" onclick="handleUCSave()">Save Record</button>
      </div>
      <div id="uc-status" class="uc-status"></div>
    </div>

    <button class="nav-about nav-dashboard" id="nav-dashboard" onclick="selectDashboard()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      <span>Assessment home</span>
    </button>

    <button class="nav-about" id="nav-about" onclick="selectAbout()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span>About the framework</span>
    </button>

    <div class="nav-scroll" id="nav-scroll">
      <!-- Rendered by JS from workflow.json -->
    </div>
  </nav>

  <!-- RIGHT: Detail panel -->
  <main class="detail-panel" id="detail-panel" aria-live="polite">
    <div class="detail-empty">
      <svg class="detail-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
      </svg>
      <p class="detail-empty-text">Select a step to view details</p>
    </div>
  </main>

</div>

<style>
/* ---- Central Use Case Identity panel ---- */
.uc-panel { padding: 10px 14px 10px; border-bottom: 1px solid var(--color-border); background: var(--color-bg-subtle, #f8fafc); }
.uc-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--color-text-tertiary); margin: 0 0 7px; display: flex; align-items: center; gap: 5px; }
.uc-input { display: block; width: 100%; padding: 5px 8px; border: 1px solid var(--color-border); border-radius: 4px; font-size: 11px; font-family: inherit; color: var(--color-text-primary); background: var(--color-bg); margin-bottom: 5px; box-sizing: border-box; outline: none; }
.uc-input:focus { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
.uc-input::placeholder { color: var(--color-text-tertiary); }
.uc-btn-row { display: flex; gap: 5px; margin-top: 2px; }
.uc-btn { flex: 1; padding: 6px 4px; font-size: 11px; font-weight: 600; border-radius: 4px; cursor: pointer; font-family: inherit; transition: background .15s; }
.uc-btn-load { background: transparent; border: 1px solid var(--color-border); color: var(--color-text-secondary); }
.uc-btn-load:hover { background: var(--color-bg-hover, #f1f5f9); }
.uc-btn-save { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); border: none; color: #241d08; }
.uc-btn-save:hover { background: linear-gradient(180deg, var(--gold), var(--gold-deep)); }
.uc-status { font-size: 10px; color: var(--success-text); margin-top: 5px; min-height: 14px; transition: opacity .6s; opacity: 0; }
</style>

<script>
// ---- Icons (inline SVG strings keyed by name) ---------------
const ICONS = {
  user: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`,
  shield: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 9.7-8 11-4.5-1.3-8-6-8-11V7l8-4z"/></svg>`,
  users: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.85"/></svg>`,
  building: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h.01M15 9h.01M9 15h.01M15 15h.01"/></svg>`,
  check: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>`,
  doc: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`
};

// ---- Phase color key lookup --------------------------------
const PHASE_COLOR = {
  teal: 'teal', purple: 'purple', amber: 'amber', blue: 'blue', coral: 'coral'
};

// ---- Applicability badge key lookup ------------------------
const APPLIC_CLASS = {
  'all': 'all',
  'tier2': 'tier2',
  'ops': 'ops',
  'personal-data': 'pdata'
};

// ---- Load workflow.json ------------------------------------
async function loadWorkflow() {
  const res = await fetch('workflow.json');
  if (!res.ok) throw new Error('Could not load workflow.json');
  return res.json();
}

// ---- Build step index for quick lookup ---------------------
function indexSteps(workflow) {
  const idx = {};
  workflow.steps.forEach(s => { idx[s.id] = s; });
  return idx;
}

function indexPhases(workflow) {
  const idx = {};
  workflow.phases.forEach(p => { idx[p.id] = p; });
  return idx;
}

// ---- Render nav panel from data ----------------------------
// A step counts as complete when its own record slice holds a real, saved
// result — not merely an AI-tool-loaded draft. Drives the green nav icons.
function isStepComplete(stepId) {
  const rec = (window.WizUtils && WizUtils.loadRecord && WizUtils.loadRecord()) || {};
  const s = rec[stepId];
  if (!s) return false;
  switch (stepId) {
    case 'step-2':  return !!(s.business_case && s.business_case.trim());
    case 'step-3':  return !!s.axis_b?.ai_act_outcome;                 // classified, not a draft
    case 'step-4':  return !!s.completion_date;                        // DPIA saved, not a draft
    case 'step-5':  return !!(s.legal_assessment?.completed || s.group_standard_assessment?.completed);
    case 'step-6':  return !!s.assessment_date;                        // controls saved, not the selected_hs draft
    case 'step-7':  return !!s.assessment_date;
    case 'step-1':
    case 'step-8':
    case 'step-10':
    case 'step-11':
    case 'step-12': return !!s.attested;
    default:        return true;
  }
}

function renderNav(workflow, stepIndex, phaseIndex, activeStepId) {
  const container = document.getElementById('nav-scroll');
  let html = '';

  workflow.phases.forEach(phase => {
    const colorKey = PHASE_COLOR[phase.colorKey] || 'teal';
    html += `
      <div class="nav-phase">
        <div class="nav-phase-header">
          <span class="nav-phase-pip pip-${colorKey}"></span>
          <span class="nav-phase-label">Phase ${phase.number} — ${phase.title}</span>
        </div>`;

    phase.steps.forEach(stepId => {
      const step = stepIndex[stepId];
      if (!step) return;
      const isActive = stepId === activeStepId;
      const activeClass = isActive ? `active active-${colorKey}` : '';
      // Step icons are gold until the step is completed, then green — a quick
      // scan of the nav shows what's done.
      const doneClass = isStepComplete(step.id) ? 'nav-step-num--done' : 'nav-step-num--todo';
      html += `
        <button class="nav-step ${activeClass}" data-step-id="${step.id}" onclick="selectStep('${step.id}')">
          <span class="nav-step-num ${doneClass}">${step.number}</span>
          <span class="nav-step-title">${step.title}</span>
          ${step.isNew ? '<span class="nav-step-new">new</span>' : ''}
        </button>`;
    });

    html += `</div>`;
  });

  container.innerHTML = html;
}

// (Legacy renderDetail / renderStep3Detail removed — steps render via mountStep*Wizard and buildStepHeader.)

// ---- Select and display a step -----------------------------
let _workflow = null;
let _stepIndex = null;
let _phaseIndex = null;
let _activeStepId = null;

function selectAbout() {
  _activeStepId = null;
  // Clear step highlighting; mark the About item active.
  if (_workflow) renderNav(_workflow, _stepIndex, _phaseIndex, null);
  document.getElementById('nav-about')?.classList.add('active');
  const panel = document.getElementById('detail-panel');
  panel.scrollTop = 0;
  if (typeof mountAboutFramework === 'function') mountAboutFramework(panel);
}

// ---- Assessment home / dashboard (Wave 5) --------------------
// One screen: how ready you are, every step's status, and one-click into any
// step. The self-service hub a non-practitioner lands on.
function selectDashboard() {
  _activeStepId = null;
  if (_workflow) renderNav(_workflow, _stepIndex, _phaseIndex, null);
  document.getElementById('nav-about')?.classList.remove('active');
  document.getElementById('nav-dashboard')?.classList.add('active');
  const panel = document.getElementById('detail-panel');
  panel.scrollTop = 0;
  panel.innerHTML = '';
  panel.appendChild(buildDashboard());
}

function buildDashboard() {
  WizUtils.injectStyles('dashboard-styles', `
    .dash{max-width:920px;margin:0 auto;padding:8px 4px 40px}
    .dash-head{margin-bottom:20px}
    .dash-kicker{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-tertiary);margin:0 0 4px}
    .dash-title{font-size:26px;font-weight:700;color:var(--color-text-primary);margin:0}
    .dash-sub{font-size:13px;color:var(--color-text-secondary);margin:6px 0 0}
    .dash-meter{background:var(--color-surface);border:1px solid var(--color-border-mid,var(--color-border));border-radius:12px;padding:20px 22px;margin:18px 0 24px}
    .dash-meter-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .dash-pct{font-size:34px;font-weight:800;color:var(--teal-600,#5dcaa5);line-height:1}
    .dash-pct small{font-size:14px;font-weight:600;color:var(--color-text-secondary);margin-left:8px}
    .dash-meter-note{font-size:13px;color:var(--color-text-secondary)}
    .dash-bar{height:12px;border-radius:8px;background:var(--color-bg);overflow:hidden;border:1px solid var(--color-border)}
    .dash-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal-400,#5dcaa5),var(--teal-600,#3fae86));transition:width .4s}
    .dash-phase{margin-bottom:18px}
    .dash-phase-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-tertiary);margin:0 0 8px}
    .dash-pip{width:9px;height:9px;border-radius:50%}
    .dash-steps{display:flex;flex-direction:column;gap:8px}
    .dash-step{display:flex;align-items:center;gap:12px;background:var(--color-surface);border:1px solid var(--color-border-mid,var(--color-border));border-radius:8px;padding:11px 14px;cursor:pointer;transition:border-color .12s,background .12s}
    .dash-step:hover{border-color:var(--teal-400,#2dd4bf);background:var(--color-bg-hover,rgba(0,0,0,0.02))}
    .dash-step-num{width:26px;height:26px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
    .dash-step-num--done{background:var(--teal-400,#5dcaa5);color:#08251c}
    .dash-step-num--todo{background:var(--color-bg);border:1px solid var(--color-border-mid,var(--color-border));color:var(--color-text-tertiary)}
    .dash-step-title{flex:1;font-size:14px;font-weight:600;color:var(--color-text-primary);min-width:0}
    .dash-step-status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:10px}
    .dash-step-status--done{background:rgba(52,199,120,0.16);color:#2c9e5e}
    .dash-step-status--todo{background:var(--color-bg);color:var(--color-text-tertiary);border:1px solid var(--color-border)}
    .dash-step-arrow{color:var(--color-text-tertiary);font-size:16px}
    .dash-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--color-border)}
    .dash-btn{font-size:12.5px;font-weight:600;font-family:inherit;border-radius:7px;padding:9px 16px;cursor:pointer;border:1px solid var(--color-border-mid,var(--color-border));background:var(--color-surface);color:var(--color-text-secondary)}
    .dash-btn:hover{color:var(--color-text-primary);border-color:var(--teal-400,#2dd4bf)}
    .dash-btn--primary{background:var(--teal-400,#5dcaa5);border-color:var(--teal-400,#5dcaa5);color:#08251c}
    .dash-next{display:inline-flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;font-weight:600;color:var(--teal-600,#3fae86);background:none;border:none;cursor:pointer;font-family:inherit;padding:0}
  `);

  const rec = (window.WizUtils && WizUtils.loadRecord && WizUtils.loadRecord()) || {};
  const meta = rec._meta || {};
  const ids = _orderedStepIds();
  const doneArr = ids.map(isStepComplete);
  const done = doneArr.filter(Boolean).length;
  const total = ids.length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  const firstTodo = ids.find(id => !isStepComplete(id));

  const dash = document.createElement('div');
  dash.className = 'dash';

  const head = document.createElement('div');
  head.className = 'dash-head';
  head.innerHTML = `<p class="dash-kicker">Assessment home</p>
    <h1 class="dash-title">${meta.use_case_name ? _escHtml(meta.use_case_name) : 'Your AI use case'}</h1>
    <p class="dash-sub">${meta.use_case_id ? _escHtml(meta.use_case_id) + ' · ' : ''}${meta.assessed_by ? 'Assessed by ' + _escHtml(meta.assessed_by) : 'Work through the steps below to assess and authorise this AI system.'}</p>`;
  dash.appendChild(head);

  // Readiness meter
  const meter = document.createElement('div');
  meter.className = 'dash-meter';
  const left = total - done;
  meter.innerHTML = `
    <div class="dash-meter-top">
      <div class="dash-pct">${pct}%<small>ready to deploy</small></div>
      <div class="dash-meter-note">${done} of ${total} steps complete${left ? ` · <strong>${left}</strong> to go` : ' · <strong>all done</strong> 🎉'}</div>
    </div>
    <div class="dash-bar"><div class="dash-bar-fill" style="width:${pct}%"></div></div>`;
  if (firstTodo) {
    const nb = document.createElement('button');
    nb.className = 'dash-next';
    nb.innerHTML = `Continue → ${_stepIndex[firstTodo].number} — ${_escHtml(_stepIndex[firstTodo].title)}`;
    nb.onclick = () => selectStep(firstTodo);
    meter.appendChild(nb);
  }
  dash.appendChild(meter);

  // Steps grouped by phase
  (_workflow?.phases || []).forEach(phase => {
    const steps = (phase.steps || []).filter(id => _stepIndex[id]);
    if (!steps.length) return;
    const colorKey = PHASE_COLOR[phase.colorKey] || 'teal';
    const pw = document.createElement('div');
    pw.className = 'dash-phase';
    const h = document.createElement('div');
    h.className = 'dash-phase-h';
    h.innerHTML = `<span class="dash-pip pip-${colorKey}"></span> Phase ${phase.number} — ${_escHtml(phase.title)}`;
    pw.appendChild(h);
    const list = document.createElement('div');
    list.className = 'dash-steps';
    steps.forEach(id => {
      const st = _stepIndex[id];
      const cpl = isStepComplete(id);
      const row = document.createElement('div');
      row.className = 'dash-step';
      row.onclick = () => selectStep(id);
      row.innerHTML = `
        <span class="dash-step-num ${cpl ? 'dash-step-num--done' : 'dash-step-num--todo'}">${cpl ? '✓' : st.number}</span>
        <span class="dash-step-title">${_escHtml(st.title)}</span>
        <span class="dash-step-status ${cpl ? 'dash-step-status--done' : 'dash-step-status--todo'}">${cpl ? 'Done' : 'To do'}</span>
        <span class="dash-step-arrow">→</span>`;
      list.appendChild(row);
    });
    pw.appendChild(list);
    dash.appendChild(pw);
  });

  // Footer actions
  const actions = document.createElement('div');
  actions.className = 'dash-actions';
  const exBtn = document.createElement('button');
  exBtn.className = 'dash-btn';
  exBtn.textContent = 'Load a completed example';
  exBtn.onclick = () => { if (confirm('Load a completed example assessment? This replaces the current record.')) { loadWorkedExample(); } };
  const clrBtn = document.createElement('button');
  clrBtn.className = 'dash-btn';
  clrBtn.textContent = '↺ Clear and start over';
  clrBtn.onclick = () => { if (confirm('Clear the current assessment and start over?')) { try { sessionStorage.removeItem(UC_RECORD_KEY); } catch (_) {} try { _ucSetIdentity({}); } catch (_) {} selectDashboard(); } };
  actions.append(exBtn, clrBtn);
  dash.appendChild(actions);

  return dash;
}

function _escHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// A fully-worked example assessment, so a first-time user can see one done.
function loadWorkedExample() {
  const now = new Date().toISOString();
  const today = now.slice(0, 10);
  const rec = {
    _meta: { schema_version: '1.0', title: 'AI Acceptable Use — System Authorisation Record', standard: 'ISO/IEC 42001-aligned', created: now, last_modified: now, use_case_name: 'JAKE — Contract Q&A Assistant', use_case_id: 'UC-2025-014', assessed_by: 'A. Rivera (Risk & Compliance)' },
    'step-1': { attested: true, attested_by: 'A. Rivera', attested_at: now },
    'step-2': { step_id: 'step-2', business_case: 'JAKE is an AI assistant used by the Legal and Procurement teams to answer questions from uploaded customer contracts and draft summary clauses. It runs on a third-party foundation-model API; our organisation is the deployer. Its outputs are shared with clients. It processes customer contracts and financial records, which include personal data (PII). People use its outputs as the basis for decisions; human verification is currently informal. If it produces an incorrect or hallucinated output, the assessed business impact is severe, and could cause a regulatory or compliance breach.', input_mode: 'text', saved_at: now },
    'step-3': { step_id: 'step-3', step_title: 'System classification', axis_a: { tier: 'tier_2', tier_label: 'Tier 2 — Business-impacting' }, axis_b: { ai_act_outcome: 'high_risk', organisation_role: 'deployer', transparency_obligations_apply: true, applicable_articles: [{ article_number: 'Article 10' }, { article_number: 'Article 14' }, { article_number: 'Article 15' }] }, combined_outcome: { article_14_human_oversight: true, requires_conformity_assessment: true }, all_requirement_control_numbers: [], rationale: 'High-risk: assists decisions affecting access to an essential service; deployer role; transparency and human-oversight obligations apply.', classified_by: 'A. Rivera', use_case_id: 'UC-2025-014' },
    'step-4': { step_id: 'step-4', step_title: 'Data identification and DPIA', completion_date: today, lawful_basis: 'Art.6(1)(f) — Legitimate interests', inherent_risk_rating: 'High', residual_risk_rating: 'Medium', dpo_consulted: 'Yes', data_types_identified: { data_subjects: ['Customers', 'Employees'], standard_personal_data: ['Name', 'Contact details', 'Contract terms'], special_category_data: [], automated_decision_making: 'No', security_measures: ['Encryption at rest', 'Role-based access control', 'Audit logging'], privacy_risks: ['Re-identification of pseudonymised contract data', 'Excessive retention of uploaded documents', 'Personal data egress to a third-party model'] }, answers: {} },
    'step-5': { legal_assessment: { completed: true, assessment_date: today, total_risks: 24, selected_count: 18, risks: [] }, group_standard_assessment: { completed: true, assessment_date: today, total_risks: 1, selected_count: 1, risks: [] } },
    'step-6': { assessment_date: today },
    'step-7': { assessment_date: today },
    'step-8': { attested: true },
    'step-10': { attested: true },
    'step-11': { attested: true },
    'step-12': { attested: true }
  };
  try { sessionStorage.setItem(UC_RECORD_KEY, JSON.stringify(rec)); } catch (_) {}
  try { _ucSetIdentity(rec._meta); } catch (_) {}
  try { window.dispatchEvent(new Event('record-saved')); } catch (_) {}
  selectDashboard();
}

async function selectStep(stepId) {
  if (!_workflow || !_stepIndex) return;
  _activeStepId = stepId;

  const step = _stepIndex[stepId];
  const phase = _phaseIndex[step.phaseId];
  const color = PHASE_COLOR[phase.colorKey] || 'teal';
  const phaseTitle = `Phase ${phase.number} — ${phase.title}`;

  // Update nav active state
  renderNav(_workflow, _stepIndex, _phaseIndex, stepId);
  document.getElementById('nav-about')?.classList.remove('active');

  // Scroll detail to top
  const panel = document.getElementById('detail-panel');
  panel.scrollTop = 0;

  // Try to load step detail file if referenced
  let detailData = null;
  if (step.detailFile) {
    try {
      const res = await fetch(step.detailFile);
      if (res.ok) detailData = await res.json();
    } catch (e) {
      // Detail file not yet created — fall through to base render
    }
  }

  // Render: step-specific wizards, rich renderer for other steps with detail files, base otherwise
  if (stepId === 'step-2') {
    mountStep2Wizard(panel, step, detailData, color, phaseTitle);
  } else if (stepId === 'step-3' && detailData) {
    mountStep3Wizard(panel, step, detailData, color, phaseTitle);
  } else if (stepId === 'step-4') {
    mountStep4Wizard(panel, step, detailData, color, phaseTitle);
  } else if (stepId === 'step-5') {
    mountStep5Wizard(panel, step, detailData, color, phaseTitle);
  } else if (stepId === 'step-6') {
    mountStep6Wizard(panel, step, detailData, color, phaseTitle);
  } else if (stepId === 'step-7') {
    mountStep7Wizard(panel, step, detailData, color, phaseTitle);
  } else if (stepId === 'step-8') {
    mountReportWizard(panel);
  } else if (stepId === 'step-9') {
    mountStep9Wizard(panel, step, detailData, color, phaseTitle);
  } else {
    panel.innerHTML = '';
    panel.appendChild(WizUtils.buildStepHeader(step, color, phaseTitle));
    const content = document.createElement('div');
    content.className = 'step-content-section';
    // Accountability split (e.g. Step 10 — the actual user obligations briefing:
    // what the system is responsible for vs. what the user must do).
    if (step.accountability) content.appendChild(buildAccountabilityBlock(step.accountability));
    const attest = ATTEST_STEPS[stepId];
    if (attest && window.WizUtils) {
      content.appendChild(WizUtils.buildAttestation({ stepId, ...attest }));
    }
    if (content.childElementCount) panel.appendChild(content);
  }

  // Momentum bar — global Back · progress · Next (Wave 2)
  const _mb = buildMomentumBar(stepId);
  if (_mb) panel.appendChild(_mb);

  // Plain-language glossary — wrap jargon with hover definitions (Wave 2).
  // Runs now for synchronous content, and again shortly after for steps that
  // render asynchronously (glossify is idempotent).
  try { WizUtils.glossify(panel); } catch (_) {}
  setTimeout(() => { try { WizUtils.glossify(panel); } catch (_) {} }, 500);

  // No dead-ends — make "complete Step N first" notices clickable (Wave 2)
  try { linkifyDeadEnds(panel); } catch (_) {}
  setTimeout(() => { try { linkifyDeadEnds(panel); } catch (_) {} }, 500);
}

// Renders the system-vs-user responsibilities split used by the User obligations
// briefing (Step 10): the assessor sees exactly what to brief users on.
function buildAccountabilityBlock(acc) {
  const wrap = document.createElement('div');
  wrap.className = 'acc-briefing';
  wrap.appendChild(WizUtils.el('p', 'section-label', { textContent: 'User obligations briefing' }));
  const grid = document.createElement('div');
  grid.className = 'accountability-grid';
  [['system', 'System responsibilities', acc.system || []],
   ['user', 'User responsibilities', acc.user || []]].forEach(([cls, title, items]) => {
    const col = document.createElement('div');
    col.className = `acc-col ${cls}`;
    col.appendChild(WizUtils.el('p', 'acc-col-title', { textContent: title }));
    const ul = document.createElement('ul');
    items.forEach(i => ul.appendChild(WizUtils.el('li', null, { textContent: i })));
    col.appendChild(ul);
    grid.appendChild(col);
  });
  wrap.appendChild(grid);
  return wrap;
}

// ---- Momentum bar (Wave 2): global Back · progress · Next -----
// A novice should always know what's next without hunting the sidebar. Shown at
// the foot of every step; the Next button lights up once the step is complete.
function _orderedStepIds() {
  const ids = [];
  (_workflow?.phases || []).forEach(p => (p.steps || []).forEach(id => { if (_stepIndex && _stepIndex[id]) ids.push(id); }));
  return ids;
}

function buildMomentumBar(stepId) {
  if (!_workflow || !_stepIndex) return null;
  WizUtils.injectStyles('momentum-styles', `
    .momentum-bar{position:sticky;bottom:0;display:flex;align-items:stretch;gap:12px;justify-content:space-between;margin-top:28px;padding:12px 16px;background:var(--color-surface);border-top:1px solid var(--color-border-mid,var(--color-border));box-shadow:0 -6px 16px rgba(0,0,0,0.18);z-index:20}
    .momentum-btn{display:flex;align-items:center;gap:10px;background:var(--color-bg);border:1px solid var(--color-border-mid,var(--color-border));border-radius:8px;padding:8px 14px;cursor:pointer;font-family:inherit;color:var(--color-text-secondary);max-width:44%;transition:background .12s,border-color .12s,color .12s}
    .momentum-btn:hover:not(:disabled){color:var(--color-text-primary);border-color:var(--teal-400,#2dd4bf)}
    .momentum-btn:disabled{opacity:.5;cursor:default}
    .momentum-btn--next.is-ready{background:var(--teal-400,#5dcaa5);border-color:var(--teal-400,#5dcaa5);color:#08251c}
    .momentum-btn--next.is-ready .momentum-btn-kicker{color:#0c3a2b}
    .momentum-btn-text{display:flex;flex-direction:column;line-height:1.2;text-align:left;min-width:0}
    .momentum-btn--next .momentum-btn-text{text-align:right}
    .momentum-btn-kicker{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-tertiary)}
    .momentum-btn-title{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .momentum-arrow{font-size:16px;flex-shrink:0}
    .momentum-progress{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex:1;min-width:0}
    .momentum-count{font-size:11px;font-weight:700;color:var(--color-text-secondary)}
    .momentum-dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
    .momentum-dot{width:7px;height:7px;border-radius:50%;background:var(--color-border-mid,var(--color-border))}
    .momentum-dot.is-done{background:var(--teal-400,#5dcaa5)}
    .momentum-dot.is-active{background:var(--color-text-secondary);box-shadow:0 0 0 3px var(--teal-100,rgba(93,202,165,0.18))}
    .momentum-complete{font-size:10px;color:var(--color-text-tertiary)}
    @media (max-width:640px){.momentum-btn-title{display:none}.momentum-complete{display:none}}
    .deadend-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .deadend-goto{font-size:12px;font-weight:600;font-family:inherit;color:#08251c;background:var(--teal-400,#5dcaa5);border:none;border-radius:6px;padding:5px 12px;cursor:pointer}
    .deadend-goto:hover{filter:brightness(1.06)}
  `);

  const ids = _orderedStepIds();
  const i = ids.indexOf(stepId);
  if (i < 0) return null;
  const total = ids.length;
  const done = ids.filter(isStepComplete).length;
  const complete = isStepComplete(stepId);
  const prevId = i > 0 ? ids[i - 1] : null;
  const nextId = i < total - 1 ? ids[i + 1] : null;

  const bar = document.createElement('div');
  bar.className = 'momentum-bar';

  const back = document.createElement('button');
  back.className = 'momentum-btn momentum-btn--back';
  if (prevId) {
    const ps = _stepIndex[prevId];
    back.innerHTML = `<span class="momentum-arrow">←</span><span class="momentum-btn-text"><span class="momentum-btn-kicker">Back</span><span class="momentum-btn-title">${ps.number} — ${ps.title}</span></span>`;
    back.onclick = () => selectStep(prevId);
  } else { back.style.visibility = 'hidden'; }

  const prog = document.createElement('div');
  prog.className = 'momentum-progress';
  const dots = ids.map((id, k) => `<span class="momentum-dot${k === i ? ' is-active' : ''}${isStepComplete(id) ? ' is-done' : ''}"></span>`).join('');
  prog.innerHTML = `<span class="momentum-count">Step ${i + 1} of ${total}</span><span class="momentum-dots">${dots}</span><span class="momentum-complete">${done} of ${total} complete</span>`;

  const next = document.createElement('button');
  next.className = 'momentum-btn momentum-btn--next' + (complete ? ' is-ready' : '');
  if (nextId) {
    const ns = _stepIndex[nextId];
    next.innerHTML = `<span class="momentum-btn-text"><span class="momentum-btn-kicker">${complete ? 'Next ✓' : 'Next'}</span><span class="momentum-btn-title">${ns.number} — ${ns.title}</span></span><span class="momentum-arrow">→</span>`;
    next.onclick = () => selectStep(nextId);
  } else {
    next.innerHTML = `<span class="momentum-btn-text"><span class="momentum-btn-kicker">Done</span><span class="momentum-btn-title">End of workflow</span></span>`;
    next.disabled = true;
  }

  bar.append(back, prog, next);
  return bar;
}

// ---- No dead-ends (Wave 2): make "Step N not yet completed" actionable ----
// Any notice that tells the user to go complete another step gets a "Go to
// Step N" button, so a gap is never a place you have to hunt from.
function linkifyDeadEnds(root) {
  if (!root || !_stepIndex) return;
  // Broad selector (any notice/info/warn/empty box), gated hard by text + size
  // so only genuine "go complete Step N" notices get a button.
  const sel = '[class*="notice"], [class*="info"], [class*="warn"], [class*="empty"], .s5-prefilter-note';
  root.querySelectorAll(sel).forEach(elm => {
    if (elm.dataset.deadendLinked) return;
    const txt = elm.textContent || '';
    if (txt.length > 400) return;
    if (!/not yet complete|Complete (and save|Step|the)|before proceeding/i.test(txt)) return;
    const nums = [...new Set((txt.match(/Step (\d+)/g) || []).map(s => s.match(/\d+/)[0]))];
    const targets = nums.filter(nu => _stepIndex['step-' + nu] && 'step-' + nu !== _activeStepId);
    if (!targets.length) return;
    elm.dataset.deadendLinked = '1';
    const row = document.createElement('div');
    row.className = 'deadend-row';
    targets.forEach(nu => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'deadend-goto';
      b.textContent = `Go to Step ${nu} →`;
      b.onclick = () => selectStep('step-' + nu);
      row.appendChild(b);
    });
    elm.appendChild(row);
  });
}

// Steps without a full wizard can still be completed digitally — a checkbox
// + name attestation records evidence to the system record (no upload needed),
// which the report's Internal Standard Compliance section reads as "met".
const ATTEST_STEPS = {
  'step-1':  { title: 'Confirm training prerequisite', statement: 'I confirm the requestor has completed current annual AI risk awareness training.', nameLabel: 'Confirmed by' },
  'step-10': { title: 'Confirm user obligations briefing', statement: 'I confirm the use-case-specific user obligations briefing has been delivered and acknowledged.', nameLabel: 'Briefed by' },
  'step-11': { title: 'Confirm central inventory registration', statement: 'I confirm this use case has been registered in the central AI inventory and all authorisation records retained.', nameLabel: 'Registered by' },
  'step-12': { title: 'Confirm periodic / triggered review', statement: 'I confirm the periodic or triggered review has been completed and outcomes recorded.', nameLabel: 'Reviewed by' }
};

// ---- Central record key (shared by all step wizards) -------
const UC_RECORD_KEY = 'ai_workflow_system_record';

function _ucGetRecord() {
  try {
    const s = sessionStorage.getItem(UC_RECORD_KEY);
    if (s) return JSON.parse(s);
  } catch (_) {}
  return {
    _meta: {
      schema_version: '1.0',
      title: 'AI Acceptable Use — System Authorisation Record',
      standard: 'ISO/IEC 42001-aligned',
      created: new Date().toISOString(),
      last_modified: new Date().toISOString(),
      use_case_name: '',
      use_case_id: '',
      assessed_by: ''
    }
  };
}

function _ucSetRecord(rec) {
  try { sessionStorage.setItem(UC_RECORD_KEY, JSON.stringify(rec)); } catch (_) {}
}

function _ucGetIdentity() {
  return {
    use_case_name: document.getElementById('uc-name')?.value?.trim() || '',
    use_case_id:   document.getElementById('uc-id')?.value?.trim()   || '',
    assessed_by:   document.getElementById('uc-by')?.value?.trim()   || ''
  };
}

function _ucSetIdentity(meta) {
  if (!meta) return;
  const n = document.getElementById('uc-name');
  const i = document.getElementById('uc-id');
  const b = document.getElementById('uc-by');
  if (n) n.value = meta.use_case_name || '';
  if (i) i.value = meta.use_case_id   || '';
  if (b) b.value = meta.assessed_by   || '';
}

function _ucSyncToRecord() {
  const rec = _ucGetRecord();
  if (!rec._meta) rec._meta = {};
  Object.assign(rec._meta, _ucGetIdentity(), { last_modified: new Date().toISOString() });
  _ucSetRecord(rec);
}

function handleUCSave() {
  _ucSyncToRecord();
  const rec  = _ucGetRecord();
  const blob = new Blob([JSON.stringify(rec, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `system-record-${rec._meta?.use_case_id || 'draft'}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  _ucShowStatus('Saved ✓');
}

function handleUCLoad() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        _ucSetRecord(parsed);
        _ucSetIdentity(parsed._meta);
        if (_activeStepId) selectStep(_activeStepId);
        _ucShowStatus(`Loaded: ${parsed._meta?.use_case_id || file.name} ✓`);
      } catch (err) { alert('Invalid record file: ' + err.message); }
    };
    reader.readAsText(file);
  });
  inp.click();
}

function _ucShowStatus(msg) {
  const el = document.getElementById('uc-status');
  if (!el) return;
  el.textContent = msg;
  el.style.opacity = '1';
  setTimeout(() => { if (el) el.style.opacity = '0'; }, 3000);
}

// ---- Bootstrap ---------------------------------------------
async function _bootstrap() {
  try {
    _workflow = await loadWorkflow();
    await Promise.all([
      WizUtils.loadArticles(),    // hydrate the article table before any render
      WizUtils.loadSrControls(),  // hydrate the Internal Standard (SR) controls for step headers
    ]);
    _stepIndex = indexSteps(_workflow);
    _phaseIndex = indexPhases(_workflow);
    renderNav(_workflow, _stepIndex, _phaseIndex, null);
    // Refresh the nav's completion colours whenever any step saves its record.
    window.addEventListener('record-saved', () => {
      if (_workflow && _stepIndex) renderNav(_workflow, _stepIndex, _phaseIndex, _activeStepId);
    });
    // Restore UC identity from any previously saved record in this session
    try {
      const saved = sessionStorage.getItem(UC_RECORD_KEY);
      if (saved) _ucSetIdentity(JSON.parse(saved)._meta);
    } catch (_) {}
    // Wire identity inputs to auto-sync whenever user types
    ['uc-name', 'uc-id', 'uc-by'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', _ucSyncToRecord);
    });
    // Land on the assessment home so users get an at-a-glance status + a way in.
    try { selectDashboard(); } catch (_) {}
  } catch (e) {
    document.getElementById('nav-scroll').innerHTML =
      `<p style="padding:12px;font-size:12px;color:var(--color-text-tertiary)">Could not load workflow.json: ${e.message}</p>`;
  }
}
// Run the bootstrap only after the whole document — including the wizard
// scripts below (wizard-utils.js defines WizUtils) — has been parsed and
// executed. Those are classic scripts, so they all run before DOMContentLoaded.
// This removes a race where a cached workflow.json could resolve before
// WizUtils was defined, wiping the nav with "Can't find variable: WizUtils".
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _bootstrap);
} else {
  _bootstrap();
}
</script>
