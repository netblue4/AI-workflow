<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Acceptable Use — Governance Workflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

  <!-- LEFT: Navigation panel -->
  <nav class="nav-panel" aria-label="Workflow navigation">
    <div class="nav-header">
      <p class="nav-header-title">ISO/IEC 42001-aligned</p>
      <p class="nav-header-subtitle">AI Acceptable Use<br>Governance Workflow</p>
    </div>

    <!-- Central use-case identity — shared across all steps -->
    <div class="uc-panel" id="uc-panel">
      <p class="uc-panel-title">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
        Use Case Record
      </p>
      <input id="uc-name" class="uc-input" type="text" placeholder="Use case name" autocomplete="off">
      <input id="uc-id"   class="uc-input" type="text" placeholder="Use case ID  (e.g. UC-2025-001)" autocomplete="off">
      <input id="uc-by"   class="uc-input" type="text" placeholder="Assessed by  (name / role)" autocomplete="off">
      <div class="uc-btn-row">
        <button class="uc-btn uc-btn-load" onclick="handleUCLoad()">Load Record</button>
        <button class="uc-btn uc-btn-save" onclick="handleUCSave()">Save Record</button>
      </div>
      <div id="uc-status" class="uc-status"></div>
    </div>

    <div class="nav-scroll" id="nav-scroll">
      <!-- Rendered by JS from workflow.json -->
    </div>
  </nav>

  <!-- RIGHT: Detail panel -->
  <main class="detail-panel" id="detail-panel" aria-live="polite">
    <div class="detail-empty">
      <svg class="detail-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
      </svg>
      <p class="detail-empty-text">Select a step to view details</p>
    </div>
  </main>

</div>

<style>
/* ---- Central Use Case Identity panel ---- */
.uc-panel { padding: 10px 14px 10px; border-bottom: 1px solid var(--color-border); background: var(--color-bg-subtle, #f8fafc); }
.uc-panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--color-text-tertiary); margin: 0 0 7px; display: flex; align-items: center; gap: 5px; }
.uc-input { display: block; width: 100%; padding: 5px 8px; border: 1px solid var(--color-border); border-radius: 4px; font-size: 11px; font-family: inherit; color: var(--color-text-primary); background: #fff; margin-bottom: 5px; box-sizing: border-box; outline: none; }
.uc-input:focus { border-color: var(--teal-400, #2dd4bf); box-shadow: 0 0 0 2px var(--teal-100, #ccfbf1); }
.uc-input::placeholder { color: var(--color-text-tertiary); }
.uc-btn-row { display: flex; gap: 5px; margin-top: 2px; }
.uc-btn { flex: 1; padding: 6px 4px; font-size: 11px; font-weight: 600; border-radius: 4px; cursor: pointer; font-family: inherit; transition: background .15s; }
.uc-btn-load { background: transparent; border: 1px solid var(--color-border); color: var(--color-text-secondary); }
.uc-btn-load:hover { background: var(--color-bg-hover, #f1f5f9); }
.uc-btn-save { background: var(--teal-600, #0d9488); border: none; color: #fff; }
.uc-btn-save:hover { background: var(--teal-700, #0f766e); }
.uc-status { font-size: 10px; color: var(--success-600, #16a34a); margin-top: 5px; min-height: 14px; transition: opacity .6s; opacity: 0; }
</style>

<script>
// ---- Icons (inline SVG strings keyed by name) ---------------
const ICONS = {
  user: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`,
  shield: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 9.7-8 11-4.5-1.3-8-6-8-11V7l8-4z"/></svg>`,
  users: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.85"/></svg>`,
  building: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h.01M15 9h.01M9 15h.01M15 15h.01"/></svg>`,
  check: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>`,
  doc: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`
};

// ---- Phase color key lookup --------------------------------
const PHASE_COLOR = {
  teal: 'teal', purple: 'purple', amber: 'amber', blue: 'blue', coral: 'coral'
};

// ---- Applicability badge key lookup ------------------------
const APPLIC_CLASS = {
  'all': 'all',
  'tier2': 'tier2',
  'ops': 'ops',
  'personal-data': 'pdata'
};

// ---- Load workflow.json ------------------------------------
async function loadWorkflow() {
  const res = await fetch('workflow.json');
  if (!res.ok) throw new Error('Could not load workflow.json');
  return res.json();
}

// ---- Build step index for quick lookup ---------------------
function indexSteps(workflow) {
  const idx = {};
  workflow.steps.forEach(s => { idx[s.id] = s; });
  return idx;
}

function indexPhases(workflow) {
  const idx = {};
  workflow.phases.forEach(p => { idx[p.id] = p; });
  return idx;
}

// ---- Render nav panel from data ----------------------------
function renderNav(workflow, stepIndex, phaseIndex, activeStepId) {
  const container = document.getElementById('nav-scroll');
  let html = '';

  workflow.phases.forEach(phase => {
    const colorKey = PHASE_COLOR[phase.colorKey] || 'teal';
    html += `
      <div class="nav-phase">
        <div class="nav-phase-header">
          <span class="nav-phase-pip pip-${colorKey}"></span>
          <span class="nav-phase-label">Phase ${phase.number} — ${phase.title}</span>
        </div>`;

    phase.steps.forEach(stepId => {
      const step = stepIndex[stepId];
      if (!step) return;
      const isActive = stepId === activeStepId;
      const activeClass = isActive ? `active active-${colorKey}` : '';
      html += `
        <button class="nav-step ${activeClass}" data-step-id="${step.id}" onclick="selectStep('${step.id}')">
          <span class="nav-step-num color-${colorKey}">${step.number}</span>
          <span class="nav-step-title">${step.title}</span>
          ${step.isNew ? '<span class="nav-step-new">new</span>' : ''}
        </button>`;
    });

    html += `</div>`;
  });

  container.innerHTML = html;
}

// ---- Render step detail panel from step data ---------------
function renderDetail(step, phaseColor, phaseTitle) {
  const color = phaseColor || 'teal';
  const applicClass = APPLIC_CLASS[step.applicabilityKey] || 'all';

  let deliverablesHtml = step.deliverables.map(d => `
    <li class="deliverable-item">
      <span class="deliverable-icon">${ICONS.check}</span>
      <span>${d}</span>
    </li>`).join('');

  let gatesHtml = (step.gates || []).map(g => `
    <div class="gate-note ${g.type}">${g.text}</div>`).join('');

  let reqHtml = (step.requirementLabels || []).map(r => `
    <span class="req-pill">${r}</span>`).join('');

  let srBadges = (step.requirements || []).map(r => `
    <span class="badge sr">${r}</span>`).join('');

  // Accountability grid (step 13 only)
  let accountabilityHtml = '';
  if (step.accountability) {
    const sysItems = step.accountability.system.map(i => `<li>${i}</li>`).join('');
    const userItems = step.accountability.user.map(i => `<li>${i}</li>`).join('');
    accountabilityHtml = `
      <p class="section-label">Accountability split</p>
      <div class="accountability-grid">
        <div class="acc-col system">
          <p class="acc-col-title">System responsibilities</p>
          <ul>${sysItems}</ul>
        </div>
        <div class="acc-col user">
          <p class="acc-col-title">User responsibilities</p>
          <ul>${userItems}</ul>
        </div>
      </div>`;
  }

  // Hint for future step-specific detail file
  const detailHint = step.detailFile
    ? `<p style="font-size:12px;color:var(--color-text-tertiary);margin-top:12px">
        Step detail file: <code style="font-family:var(--font-mono)">${step.detailFile}</code>
       </p>`
    : '';

  return `
    <div class="step-detail-card">

      <div class="step-detail-eyebrow">
        <span class="step-detail-number color-${color}">${step.number}</span>
        <span class="step-detail-phase-label">${phaseTitle}</span>
      </div>

      <h1 class="step-detail-title">
        ${step.title}
        ${step.isNew ? '<span class="badge new" style="font-size:11px;vertical-align:middle;margin-left:8px">new</span>' : ''}
      </h1>

      <div class="step-detail-meta">
        <span class="owner-tag">${ICONS[step.ownerIcon] || ''}&nbsp;${step.owners.join(', ')}</span>
        ${srBadges}
        <span class="badge ${applicClass}">${step.applicability}</span>
      </div>

      <p class="step-detail-summary">${step.summary}</p>

      <p class="section-label">Deliverables</p>
      <ul class="deliverables-list">${deliverablesHtml}</ul>

      ${accountabilityHtml}

      ${gatesHtml ? `<p class="section-label" style="margin-top:${step.accountability ? '16px' : '0'}">Gates and notes</p>${gatesHtml}` : ''}

      <div class="req-list">${reqHtml}</div>

      ${detailHint}

    </div>`;
}

// ---- Render step-3 dual-axis classification detail ---------
function renderStep3Detail(step, detail, color, phaseTitle) {
  const cm = detail.classification_model;
  const axisA = detail.axis_a_classification;
  const axisB = detail.axis_b_classification;
  const matrix = detail.combined_outcome_matrix;

  // Tier cards
  const tierCards = axisA.tiers.map(t => `
    <div style="background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--border-radius-md);padding:12px 14px;margin-bottom:8px">
      <p style="font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px">${t.label}</p>
      <p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:8px">${t.definition}</p>
      <p style="font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Examples</p>
      ${t.examples.map(e => `<span style="display:inline-block;font-size:11px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:4px;padding:2px 7px;margin:2px 2px 2px 0;color:var(--color-text-secondary)">${e}</span>`).join('')}
      <p style="margin-top:8px;font-size:11px;color:${t.change_board_required ? 'var(--warning-text)' : 'var(--success-text)'};background:${t.change_board_required ? 'var(--warning-fill)' : 'var(--success-fill)'};padding:3px 8px;border-radius:4px;display:inline-block">
        ${t.change_board_required ? 'AI Change Board approval required' : 'ISG fast-track eligible'}
      </p>
    </div>`).join('');

  // Gate summary rows
  const gateRows = axisB.gates.map(g => `
    <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--color-bg);border-radius:var(--border-radius-md);margin-bottom:6px">
      <span style="min-width:32px;font-size:10px;font-weight:500;padding:2px 6px;border-radius:4px;background:var(--purple-fill);color:var(--purple-text);margin-top:1px">${g.gate_id}</span>
      <div>
        <p style="font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:2px">${g.gate_name}</p>
        <p style="font-size:12px;color:var(--color-text-secondary)">${g.gate_purpose}</p>
        ${g.short_circuit ? `<p style="font-size:11px;margin-top:4px;color:var(--danger-text);background:var(--danger-fill);padding:3px 8px;border-radius:4px">${g.short_circuit}</p>` : ''}
      </div>
    </div>`).join('');

  // Outcome matrix rows
  const matrixRows = matrix.rules.map(r => `
    <tr style="border-bottom:1px solid var(--color-border)">
      <td style="padding:8px 10px;font-size:12px;color:var(--color-text-secondary)">${r.axis_a === 'any' ? 'Any' : r.axis_a === 'tier_1' ? 'Tier 1' : 'Tier 2'}</td>
      <td style="padding:8px 10px;font-size:12px">
        <span style="font-size:11px;font-weight:500;padding:2px 7px;border-radius:4px;
          background:${r.axis_b === 'PROHIBITED' ? 'var(--danger-fill)' : r.axis_b === 'HIGH_RISK' ? 'var(--warning-fill)' : r.axis_b === 'OUT_OF_SCOPE' ? 'var(--color-bg)' : 'var(--success-fill)'};
          color:${r.axis_b === 'PROHIBITED' ? 'var(--danger-text)' : r.axis_b === 'HIGH_RISK' ? 'var(--warning-text)' : r.axis_b === 'OUT_OF_SCOPE' ? 'var(--color-text-secondary)' : 'var(--success-text)'}">
          ${r.axis_b}
        </span>
      </td>
      <td style="padding:8px 10px;font-size:12px;color:var(--color-text-primary);font-weight:500">${r.label}</td>
      <td style="padding:8px 10px;font-size:11px;color:var(--color-text-secondary)">${r.article_14_human_oversight ? '✓ Art.14' : r.axis_b === 'PROHIBITED' ? '—' : 'Portfolio only'}</td>
    </tr>`).join('');

  let deliverablesHtml = detail.deliverables.map(d => `
    <li class="deliverable-item">
      <span class="deliverable-icon">${ICONS.check}</span>
      <span>${d}</span>
    </li>`).join('');

  let reqHtml = (detail.requirement_labels || []).map(r => `<span class="req-pill">${r}</span>`).join('');

  let srBadges = (step.requirements || []).map(r => `<span class="badge sr">${r}</span>`).join('');
  const applicClass = APPLIC_CLASS[step.applicabilityKey] || 'all';

  return `
    <div class="step-detail-card">

      <div class="step-detail-eyebrow">
        <span class="step-detail-number color-${color}">${step.number}</span>
        <span class="step-detail-phase-label">${phaseTitle}</span>
      </div>
      <h1 class="step-detail-title">${step.title}</h1>
      <div class="step-detail-meta">
        <span class="owner-tag">${ICONS[step.ownerIcon] || ''}&nbsp;${step.owners.join(', ')}</span>
        ${srBadges}
        <span class="badge ${applicClass}">${step.applicability}</span>
      </div>
      <p class="step-detail-summary">${cm.description}</p>

      <p class="section-label">Axis A — Internal governance tier</p>
      <p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:10px">${cm.axis_a.purpose}</p>
      ${tierCards}
      <p style="font-size:12px;color:var(--color-text-secondary);margin-top:8px;margin-bottom:24px;padding:8px 12px;background:var(--warning-fill);border-left:3px solid var(--warning-border);border-radius:var(--border-radius-md);color:var(--warning-text)">
        Escalation rule: ${axisA.escalation_rule}
      </p>

      <p class="section-label">Axis B — EU AI Act legal risk tier</p>
      <p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:10px">${cm.axis_b.purpose}</p>
      ${gateRows}
      <p style="font-size:12px;color:var(--color-text-tertiary);margin-top:4px;margin-bottom:24px">Full gate questions and article mappings are defined in <code style="font-family:var(--font-mono);font-size:11px">${axisB.reference_file}</code></p>

      <p class="section-label">Combined outcome matrix</p>
      <p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:10px">${matrix.description}</p>
      <div style="overflow-x:auto;margin-bottom:24px">
        <table style="width:100%;border-collapse:collapse;font-size:12px;border:1px solid var(--color-border);border-radius:var(--border-radius-md);overflow:hidden">
          <thead>
            <tr style="background:var(--color-bg)">
              <th style="padding:8px 10px;text-align:left;font-weight:500;color:var(--color-text-secondary);font-size:11px;border-bottom:1px solid var(--color-border)">Axis A</th>
              <th style="padding:8px 10px;text-align:left;font-weight:500;color:var(--color-text-secondary);font-size:11px;border-bottom:1px solid var(--color-border)">Axis B</th>
              <th style="padding:8px 10px;text-align:left;font-weight:500;color:var(--color-text-secondary);font-size:11px;border-bottom:1px solid var(--color-border)">Combined outcome</th>
              <th style="padding:8px 10px;text-align:left;font-weight:500;color:var(--color-text-secondary);font-size:11px;border-bottom:1px solid var(--color-border)">Human oversight</th>
            </tr>
          </thead>
          <tbody>${matrixRows}</tbody>
        </table>
      </div>

      <p class="section-label">Deliverables</p>
      <ul class="deliverables-list" style="margin-bottom:24px">${deliverablesHtml}</ul>

      <div class="gate-note info" style="margin-bottom:8px"><strong>AI SR9 clarification:</strong> ${detail.standard_note}</div>

      <div class="req-list">${reqHtml}</div>

    </div>`;
}

// ---- Select and display a step -----------------------------
let _workflow = null;
let _stepIndex = null;
let _phaseIndex = null;
let _activeStepId = null;

async function selectStep(stepId) {
  if (!_workflow || !_stepIndex) return;
  _activeStepId = stepId;

  const step = _stepIndex[stepId];
  const phase = _phaseIndex[step.phaseId];
  const color = PHASE_COLOR[phase.colorKey] || 'teal';
  const phaseTitle = `Phase ${phase.number} — ${phase.title}`;

  // Update nav active state
  renderNav(_workflow, _stepIndex, _phaseIndex, stepId);

  // Scroll detail to top
  const panel = document.getElementById('detail-panel');
  panel.scrollTop = 0;

  // Try to load step detail file if referenced
  let detailData = null;
  if (step.detailFile) {
    try {
      const res = await fetch(step.detailFile);
      if (res.ok) detailData = await res.json();
    } catch (e) {
      // Detail file not yet created — fall through to base render
    }
  }

  // Render: step-specific wizards, rich renderer for other steps with detail files, base otherwise
  if (stepId === 'step-3' && detailData) {
    mountStep3Wizard(panel, step, detailData, color, phaseTitle);
  } else if (stepId === 'step-7') {
    mountStep7Wizard(panel, step, detailData, color, phaseTitle);
  } else {
    panel.innerHTML = renderDetail(step, color, phaseTitle);
  }
}

// ---- Central record key (shared by all step wizards) -------
const UC_RECORD_KEY = 'ai_workflow_system_record';

function _ucGetRecord() {
  try {
    const s = sessionStorage.getItem(UC_RECORD_KEY);
    if (s) return JSON.parse(s);
  } catch (_) {}
  return {
    _meta: {
      schema_version: '1.0',
      title: 'AI Acceptable Use — System Authorisation Record',
      standard: 'ISO/IEC 42001-aligned',
      created: new Date().toISOString(),
      last_modified: new Date().toISOString(),
      use_case_name: '',
      use_case_id: '',
      assessed_by: ''
    }
  };
}

function _ucSetRecord(rec) {
  try { sessionStorage.setItem(UC_RECORD_KEY, JSON.stringify(rec)); } catch (_) {}
}

function _ucGetIdentity() {
  return {
    use_case_name: document.getElementById('uc-name')?.value?.trim() || '',
    use_case_id:   document.getElementById('uc-id')?.value?.trim()   || '',
    assessed_by:   document.getElementById('uc-by')?.value?.trim()   || ''
  };
}

function _ucSetIdentity(meta) {
  if (!meta) return;
  const n = document.getElementById('uc-name');
  const i = document.getElementById('uc-id');
  const b = document.getElementById('uc-by');
  if (n) n.value = meta.use_case_name || '';
  if (i) i.value = meta.use_case_id   || '';
  if (b) b.value = meta.assessed_by   || '';
}

function _ucSyncToRecord() {
  const rec = _ucGetRecord();
  if (!rec._meta) rec._meta = {};
  Object.assign(rec._meta, _ucGetIdentity(), { last_modified: new Date().toISOString() });
  _ucSetRecord(rec);
}

function handleUCSave() {
  _ucSyncToRecord();
  const rec  = _ucGetRecord();
  const blob = new Blob([JSON.stringify(rec, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `system-record-${rec._meta?.use_case_id || 'draft'}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  _ucShowStatus('Saved ✓');
}

function handleUCLoad() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        _ucSetRecord(parsed);
        _ucSetIdentity(parsed._meta);
        if (_activeStepId) selectStep(_activeStepId);
        _ucShowStatus(`Loaded: ${parsed._meta?.use_case_id || file.name} ✓`);
      } catch (err) { alert('Invalid record file: ' + err.message); }
    };
    reader.readAsText(file);
  });
  inp.click();
}

function _ucShowStatus(msg) {
  const el = document.getElementById('uc-status');
  if (!el) return;
  el.textContent = msg;
  el.style.opacity = '1';
  setTimeout(() => { if (el) el.style.opacity = '0'; }, 3000);
}

// ---- Bootstrap ---------------------------------------------
(async () => {
  try {
    _workflow = await loadWorkflow();
    _stepIndex = indexSteps(_workflow);
    _phaseIndex = indexPhases(_workflow);
    renderNav(_workflow, _stepIndex, _phaseIndex, null);
    // Restore UC identity from any previously saved record in this session
    try {
      const saved = sessionStorage.getItem(UC_RECORD_KEY);
      if (saved) _ucSetIdentity(JSON.parse(saved)._meta);
    } catch (_) {}
    // Wire identity inputs to auto-sync whenever user types
    ['uc-name', 'uc-id', 'uc-by'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', _ucSyncToRecord);
    });
  } catch (e) {
    document.getElementById('nav-scroll').innerHTML =
      `<p style="padding:12px;font-size:12px;color:var(--color-text-tertiary)">Could not load workflow.json: ${e.message}</p>`;
  }
})();
</script>
